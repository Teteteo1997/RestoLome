<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - RestoLomé</title>
    <!-- Bootstrap CSS pour un design propre -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Administration - RestoLomé</h2>
            <button id="btnDeconnexion" class="btn btn-danger">Se déconnecter</button>
        </div>

        <!-- Formulaire d'ajout de restaurant -->
        <div class="card p-4 shadow-sm bg-white rounded mb-5">
            <h4 class="mb-3">Ajouter un nouveau restaurant</h4>
            <form id="formAjoutRestaurant">
                <div class="mb-3">
                    <label for="nomResto" class="form-label">Nom du restaurant</label>
                    <input type="text" class="form-control" id="nomResto" required>
                </div>
                <div class="mb-3">
                    <label for="quartierResto" class="form-label">Quartier</label>
                    <input type="text" class="form-control" id="quartierResto" required>
                </div>
                <div class="mb-3">
                    <label for="cuisineResto" class="form-label">Type de cuisine</label>
                    <input type="text" class="form-control" id="cuisineResto" required>
                </div>
                <button type="submit" class="btn btn-primary">Enregistrer le restaurant</button>
            </form>
        </div>

        <!-- Section de gestion des réservations -->
        <div class="card p-4 shadow-sm bg-white rounded">
            <h4 class="mb-3">Liste des réservations clients</h4>
            <div id="listeReservations">
                <p class="text-muted">Chargement des réservations...</p>
            </div>
        </div>
    </div>

    <!-- Script JavaScript -->
    <script>
        // 1. Vérification sécurisée du token au chargement
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.replace('login.html');
        }

        // 2. Gestion de la déconnexion
        document.getElementById('btnDeconnexion').addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.replace('login.html');
        });

        // 3. Soumission du formulaire d'ajout de restaurant
        document.getElementById('formAjoutRestaurant').addEventListener('submit', async function(e) {
            e.preventDefault();

            const nom = document.getElementById('nomResto').value;
            const quartier = document.getElementById('quartierResto').value;
            const cuisine = document.getElementById('cuisineResto').value;

            try {
                const response = await fetch('/api/restaurants', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ nom, quartier, cuisine })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.message);
                    document.getElementById('formAjoutRestaurant').reset();
                } else {
                    if (response.status === 401 || response.status === 403) {
                        alert("Votre session a expiré. Veuillez vous reconnecter.");
                        localStorage.removeItem('token');
                        window.location.replace('login.html');
                    } else {
                        alert("Erreur : " + (data.error || data.erreur));
                    }
                }
            } catch (error) {
                console.error("Erreur réseau :", error);
                alert("Impossible de joindre le serveur.");
            }
        });
    </script>
</body>
</html>
