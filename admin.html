<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestoLomé - Dashboard Admin</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .btn-logout {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        .btn-delete {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Administration des Réservations</h1>
        <button id="logoutBtn" class="btn-logout">Déconnexion</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nom du client</th>
                <th>Téléphone</th>
                <th>Restaurant</th>
                <th>Date & Heure</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="reservationsTable">
            <!-- Rempli en JavaScript -->
        </tbody>
    </table>

    <script>
        const token = localStorage.getItem('resto_token');

        if (!token) {
            window.location.href = '/login.html';
        }

        async function chargerReservations() {
            try {
                const response = await fetch('/api/reservations', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.status === 401 || response.status === 403) {
                    localStorage.removeItem('resto_token');
                    window.location.href = '/login.html';
                    return;
                }

                const reservations = await response.json();
                const tableBody = document.getElementById('reservationsTable');
                tableBody.innerHTML = '';

                reservations.forEach(res => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>#${res.id}</td>
                        <td>${res.nom}</td>
                        <td>${res.telephone}</td>
                        <td>${res.restaurant}</td>
                        <td>${new Date(res.date_reservation).toLocaleString('fr-FR')}</td>
                        <td>
                            <button class="btn-delete" onclick="annulerReservation(${res.id})">Annuler</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (err) {
                console.error('Erreur :', err);
            }
        }

        async function annulerReservation(id) {
            if (!confirm(`Voulez-vous vraiment annuler la réservation #${id} ?`)) return;

            try {
                const response = await fetch(`/api/reservations/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    chargerReservations();
                } else {
                    const errorData = await response.json();
                    alert(errorData.error || 'Erreur lors de l\'annulation.');
                }
            } catch (err) {
                console.error('Erreur :', err);
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('resto_token');
            window.location.href = '/login.html';
        });

        chargerReservations();
    </script>
</body>
</html>
